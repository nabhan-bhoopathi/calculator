<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Scientific Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent-primary: #00d2ff;
            --accent-secondary: #3a7bd5;
            --text-main: #ffffff;
            --btn-hover: rgba(255, 255, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            overflow: hidden;
            background-color: #050505;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .calculator-container {
            width: 90%;
            max-width: 400px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .display-container {
            margin-bottom: 20px;
            text-align: right;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #history-display {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 5px;
            height: 1.2rem;
            overflow: hidden;
        }

        #main-display {
            font-size: 2rem;
            font-weight: 300;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }

        #main-display::-webkit-scrollbar {
            display: none;
        }

        .controls-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .scientific-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
        }

        .scientific-grid.active {
            max-height: 200px;
        }

        button {
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            padding: 15px 5px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-operator {
            color: var(--accent-primary);
            font-weight: bold;
        }

        .btn-equal {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            grid-column: span 2;
        }

        .btn-sci-toggle {
            background: rgba(255, 255, 255, 0.15);
            font-size: 0.8rem;
            grid-column: span 4;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sci-btn {
            font-size: 0.85rem;
            background: rgba(0, 210, 255, 0.1);
            color: #b3e5fc;
        }

        .mode-indicator {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 0.7rem;
            opacity: 0.6;
        }

        /* Responsive Mobile adjustments */
        @media (max-width: 480px) {
            .calculator-container {
                width: 95%;
                padding: 15px;
            }
            button {
                padding: 12px 5px;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="calculator-container">
        <div class="mode-indicator" id="mode-text">RAD</div>
        <div class="display-container">
            <div id="history-display"></div>
            <div id="main-display">0</div>
        </div>

        <button class="btn-sci-toggle" onclick="toggleScientific()">Scientific Mode</button>

        <div class="scientific-grid" id="scientific-panel">
            <button class="sci-btn" onclick="inputSci('sin')">sin</button>
            <button class="sci-btn" onclick="inputSci('cos')">cos</button>
            <button class="sci-btn" onclick="inputSci('tan')">tan</button>
            <button class="sci-btn" onclick="inputSci('log')">log</button>
            <button class="sci-btn" onclick="inputSci('ln')">ln</button>
            <button class="sci-btn" onclick="inputSci('sqrt')">√</button>
            <button class="sci-btn" onclick="inputSci('pow')">xʸ</button>
            <button class="sci-btn" onclick="inputSci('pi')">π</button>
            <button class="sci-btn" onclick="inputSci('e')">e</button>
            <button class="sci-btn" onclick="toggleDegRad()">D/R</button>
        </div>

        <div class="controls-row">
            <button class="btn-operator" onclick="clearDisplay()">AC</button>
            <button class="btn-operator" onclick="deleteLast()"><i class="fas fa-backspace"></i></button>
            <button class="btn-operator" onclick="inputChar('%')">%</button>
            <button class="btn-operator" onclick="inputChar('/')">÷</button>
            
            <button onclick="inputChar('7')">7</button>
            <button onclick="inputChar('8')">8</button>
            <button onclick="inputChar('9')">9</button>
            <button class="btn-operator" onclick="inputChar('*')">×</button>
            
            <button onclick="inputChar('4')">4</button>
            <button onclick="inputChar('5')">5</button>
            <button onclick="inputChar('6')">6</button>
            <button class="btn-operator" onclick="inputChar('-')">−</button>
            
            <button onclick="inputChar('1')">1</button>
            <button onclick="inputChar('2')">2</button>
            <button onclick="inputChar('3')">3</button>
            <button class="btn-operator" onclick="inputChar('+')">+</button>
            
            <button onclick="inputChar('0')">0</button>
            <button onclick="inputChar('.')">.</button>
            <button class="btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        // --- THREE.JS BACKGROUND ---
        let scene, camera, renderer, shapes = [];

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00d2ff, 1);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            // Create floating shapes
            const geometries = [
                new THREE.IcosahedronGeometry(1, 0),
                new THREE.TorusGeometry(0.7, 0.2, 16, 100),
                new THREE.OctahedronGeometry(1, 0)
            ];

            for(let i = 0; i < 15; i++) {
                const material = new THREE.MeshPhongMaterial({
                    color: Math.random() > 0.5 ? 0x00d2ff : 0x3a7bd5,
                    transparent: true,
                    opacity: 0.3,
                    wireframe: true
                });
                const shape = new THREE.Mesh(geometries[Math.floor(Math.random() * geometries.length)], material);
                
                shape.position.set(
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 10 - 5
                );
                
                shape.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                shape.userData.velocity = {
                    x: (Math.random() - 0.5) * 0.01,
                    y: (Math.random() - 0.5) * 0.01,
                    z: (Math.random() - 0.5) * 0.01
                };
                
                shapes.push(shape);
                scene.add(shape);
            }

            camera.position.z = 5;
        }

        function animate() {
            requestAnimationFrame(animate);

            shapes.forEach(shape => {
                shape.rotation.x += 0.005;
                shape.rotation.y += 0.005;
                shape.position.x += shape.userData.velocity.x;
                shape.position.y += shape.userData.velocity.y;

                // Bounce
                if(Math.abs(shape.position.x) > 10) shape.userData.velocity.x *= -1;
                if(Math.abs(shape.position.y) > 10) shape.userData.velocity.y *= -1;
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- CALCULATOR LOGIC ---
        let currentInput = "0";
        let history = "";
        let isScientific = false;
        let angleMode = 'RAD'; // 'DEG' or 'RAD'

        const mainDisplay = document.getElementById('main-display');
        const historyDisplay = document.getElementById('history-display');
        const sciPanel = document.getElementById('scientific-panel');
        const modeText = document.getElementById('mode-text');

        function updateDisplay() {
            mainDisplay.innerText = currentInput;
            historyDisplay.innerText = history;
        }

        function inputChar(char) {
            if (currentInput === "0" && char !== ".") {
                currentInput = char;
            } else {
                currentInput += char;
            }
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = "0";
            history = "";
            updateDisplay();
        }

        function deleteLast() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = "0";
            }
            updateDisplay();
        }

        function toggleScientific() {
            isScientific = !isScientific;
            sciPanel.classList.toggle('active');
        }

        function toggleDegRad() {
            angleMode = angleMode === 'RAD' ? 'DEG' : 'RAD';
            modeText.innerText = angleMode;
        }

        function inputSci(func) {
            switch(func) {
                case 'pi': inputChar(Math.PI.toFixed(8)); break;
                case 'e': inputChar(Math.E.toFixed(8)); break;
                case 'sin': currentInput = `sin(${currentInput})`; break;
                case 'cos': currentInput = `cos(${currentInput})`; break;
                case 'tan': currentInput = `tan(${currentInput})`; break;
                case 'log': currentInput = `log10(${currentInput})`; break;
                case 'ln': currentInput = `log(${currentInput})`; break;
                case 'sqrt': currentInput = `sqrt(${currentInput})`; break;
                case 'pow': currentInput += `^`; break;
            }
            updateDisplay();
        }

        function calculate() {
            try {
                history = currentInput;
                let expression = currentInput
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/\^/g, '**');

                // Advanced math parsing for scientific strings
                // We use a custom scope to handle sin/cos/etc.
                const scope = {
                    sin: (x) => angleMode === 'DEG' ? Math.sin(x * Math.PI / 180) : Math.sin(x),
                    cos: (x) => angleMode === 'DEG' ? Math.cos(x * Math.PI / 180) : Math.cos(x),
                    tan: (x) => angleMode === 'DEG' ? Math.tan(x * Math.PI / 180) : Math.tan(x),
                    log10: (x) => Math.log10(x),
                    log: (x) => Math.log(x),
                    sqrt: (x) => Math.sqrt(x)
                };

                // Evaluation using Function constructor with sandbox-like approach
                // Note: In a production app, use a math library like math.js for safety and precision.
                const keys = Object.keys(scope);
                const values = Object.values(scope);
                const result = new Function(...keys, `return ${expression}`)(...values);
                
                currentInput = Number.isInteger(result) ? result.toString() : parseFloat(result.toFixed(8)).toString();
            } catch (error) {
                currentInput = "Error";
            }
            updateDisplay();
        }

        // Initialize everything on load
        window.onload = () => {
            initThree();
            animate();
            updateDisplay();
        };

        // Mouse interaction for 3D effect
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            
            // Tilt calculator slightly
            const calc = document.querySelector('.calculator-container');
            calc.style.transform = `perspective(1000px) rotateX(${-y * 5}deg) rotateY(${x * 5}deg)`;
            
            // Move camera slightly
            camera.position.x = x * 0.5;
            camera.position.y = -y * 0.5;
            camera.lookAt(scene.position);
        });

    </script>
</body>
</html>
